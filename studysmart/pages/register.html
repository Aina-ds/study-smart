<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - StudySmart</title>
    <link rel="stylesheet" href="../css/style.css">
    
    <style>
        /* Full-page gradient background for registration page */
        .register-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        /* Registration card styling */
        .register-card {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;  /* Slightly wider than login for more fields */
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }
        
        .register-card h2 {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .login-link {
            text-align: center;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <!-- Brand Logo -->
            <div class="logo" style="text-align: center;">Study<span>Smart</span></div>
            <h2>Create Account</h2>
            
            <!-- Registration Form - collects all required user information -->
            <form action="login.html">
                <!-- Full Name Field -->
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="Enter your full name" required>
                </div>
                
                <!-- Email Field - Unique identifier for user -->
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="Enter your email" required>
                </div>
                
                <!-- Phone Number Field - Optional contact information -->
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" placeholder="Enter your phone number">
                </div>
                
                <!-- Password Field - Will be hashed with bcrypt (backend) -->
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" placeholder="Create a password" required>
                    <!-- Note: According to SRS, passwords will be hashed using bcrypt -->
                </div>
                
                <!-- Password Confirmation Field - Ensures user typed correctly -->
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" placeholder="Confirm your password" required>
                </div>
                
                <!-- Submit Button -->
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </form>
            
            <!-- Link to login page for existing users -->
            <div class="login-link">
                <a href="login.html">Already have an account? Login</a>
            </div>
        </div>
    </div>
</body>
</html>
